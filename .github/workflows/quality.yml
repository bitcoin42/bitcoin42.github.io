name: Quality gates

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      # Content correctness first: these are the cheapest and the most important.
      # test:claims fails if wording corrected for technical accuracy regresses
      # in any locale (e.g. "the timelock pays out automatically", which is false).
      - name: Claim wording regression
        run: npm run test:claims

      - name: Locale parity
        run: npm run test:locales

      - name: Lint
        run: npm run lint

      - name: HTML validation
        run: npm run test:html

      # Verifies internal anchors, required assets, canonical/og/sitemap/robots/
      # manifest agreement, hreflang completeness, https-only links, and that no
      # third-party resource is requested in production.
      - name: Links, assets and canonical consistency
        run: npm run test:links

      - name: Accessibility (axe-core)
        run: npm run test:a11y

      - name: End-to-end behaviour
        run: npm run test:e2e

  smoke-deployed:
    name: Post-deployment smoke test
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test the published site
        env:
          # The Pages mirror. The canonical host (bitcoin42.com) is served via
          # Cloudflare and is NOT deployed by this workflow — see the note at the
          # end of this job.
          SITE: https://bitcoin42.github.io
        run: |
          set -euo pipefail

          # Pages publishes asynchronously, so poll for the new content rather
          # than guessing a fixed sleep.
          echo "→ waiting for deployment to carry this commit"
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' -L --max-time 30 "$SITE/" || echo 000)
            if [ "$code" = "200" ] && grep -q 'rel="canonical" href="https://bitcoin42.com/"' /tmp/page.html; then
              echo "   deployment live (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "timed out waiting for the deploy (last status $code)"; exit 1
            fi
            sleep 15
          done

          echo "→ required assets served"
          for asset in /assets/site.css /assets/site.js /locales/en.json /locales/de.json \
                       /manifest.webmanifest /robots.txt /sitemap.xml /og-image.png; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$SITE$asset")
            test "$c" = "200" || { echo "$asset -> $c"; exit 1; }
            echo "   $asset ok"
          done

          echo "→ corrected timelock wording still in place"
          if grep -Eqi 'pays the address out|paid to your key|fires on schedule|since 2009' /tmp/page.html; then
            echo "published page contains wording that was corrected for accuracy"; exit 1
          fi

          # The canonical host is deployed separately (Cloudflare). If it lags,
          # the two hosts disagree about which is canonical, which is worse for
          # SEO than either answer alone. Warn rather than fail: this workflow
          # does not control that deploy.
          echo "→ canonical host agreement"
          if curl -sS -o /tmp/canon.html -L --max-time 30 https://bitcoin42.com/ 2>/dev/null; then
            if grep -q 'rel="canonical" href="https://bitcoin42.com/"' /tmp/canon.html; then
              echo "   bitcoin42.com agrees it is canonical"
            else
              echo "::warning::bitcoin42.com is not serving the current canonical tag — its Cloudflare build may be stale or failing. The two hosts currently disagree about which is canonical."
            fi
          else
            echo "::warning::could not reach bitcoin42.com to verify canonical agreement"
          fi

          echo "all post-deployment checks passed"
